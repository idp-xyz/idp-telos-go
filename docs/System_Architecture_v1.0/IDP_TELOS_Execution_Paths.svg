<text x="45" y="346" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#FFD58B">PATH B  /  高可靠企业执行</text>
<rect x="45" y="370" width="199" height="108" rx="16" fill="#11213C" stroke="#22CFFF" stroke-width="1.3"/>
<text x="61" y="412" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#F3F7FF">Workspace / API</text>
<text x="61" y="441" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#9FB4D0">任务发起</text>
