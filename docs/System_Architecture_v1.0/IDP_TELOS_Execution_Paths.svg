<text x="61" y="211" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#F3F7FF">Workspace</text>
<text x="61" y="240" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#9FB4D0">业务交互</text>
