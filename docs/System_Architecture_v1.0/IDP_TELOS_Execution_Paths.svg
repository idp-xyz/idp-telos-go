<text x="1031" y="412" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#F3F7FF">业务系统</text>
<text x="1031" y="441" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#9FB4D0">事务提交</text>
