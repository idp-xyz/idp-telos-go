<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 1200 600" role="img"><title>TELOS 协作路径：轻量智能交互与可靠业务执行</title>
<rect width="1200" height="600" fill="#051127"/>
<text x="45" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#F3F7FF">按需组合 · 两类典型运行路径</text>
<text x="45" y="92" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#9FB4D0">示意箭头代表某类场景中的逻辑调用，不代表全平台的固定依赖。</text>
<text x="45" y="151" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#22CFFF">PATH A  /  普通问答、辅助决策</text>
