<line x1="971" y1="423" x2="1009" y2="423" stroke="#22CFFF" stroke-width="2" opacity="1"/>
<path d="M999 416 L1009 423 L999 430" fill="none" stroke="#22CFFF" stroke-width="1.8"/>
<text x="46" y="541" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#9FB4D0">CMI 可向 HOST / EER 提供授权 ContextPackage；执行审批、重试、恢复与证据由 EER 负责。</text>
<text x="46" y="570" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#9FB4D0">已绑定的 EER 任务不可在故障后绕过 EER 重放写操作。领域系统保留最终业务事实。</text>
</svg>