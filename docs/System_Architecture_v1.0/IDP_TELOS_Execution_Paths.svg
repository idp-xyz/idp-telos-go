<text x="376" y="211" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#F3F7FF">HOST</text>
<text x="376" y="240" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#9FB4D0">Agent 推理</text>
