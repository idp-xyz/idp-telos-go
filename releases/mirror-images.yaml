# The third-party images this platform depends on, copied to ghcr.io/idp-xyz/mirror (one package, one tag each) by .github/workflows/mirror.yml.
# Why: anonymous pulls from Amazon ECR Public and Docker Hub are limited per source address and the GitHub runners share
# addresses ("Data limit exceeded" on postgres:17-alpine, 2026-11-19). Our own registry has no such limit for the repository's workflows.
#
# One entry = one image: `source` is host/path@digest (the multi-platform index digest; never a tag), `tag` the tag it is known by,
# `target` where the copy goes (tags are quoted: 3.22 would be a number for a YAML reader). The copy keeps every platform and the digest: a mirrored image IS the source image.
#
# Naming rule, no exceptions: every mirrored image is a TAG of ONE package, ghcr.io/idp-xyz/mirror (one package: its visibility is
# switched once, whatever is added later). The tag encodes the source:
#   <host>__<path components joined by __>__<source tag>      ([A-Za-z0-9_.-], at most 128 characters; `check` refuses two entries
#   that encode to the same tag)
#     public.ecr.aws/docker/library/postgres:17-alpine -> ghcr.io/idp-xyz/mirror:public.ecr.aws__docker__library__postgres__17-alpine
#     docker.io/rustfs/rustfs:1.0.4-glibc              -> ghcr.io/idp-xyz/mirror:docker.io__rustfs__rustfs__1.0.4-glibc
#     quay.io/keycloak/keycloak:26.8.2                 -> ghcr.io/idp-xyz/mirror:quay.io__keycloak__keycloak__26.8.2
#   Nobody decodes a tag: `source` below is the full reference. A reference to the mirror is  ghcr.io/idp-xyz/mirror:<tag>@<digest>.
#   Docker Hub is always written docker.io/..., official images docker.io/library/... or, as here, their ECR Public copy.
#
# Scope: every registry that CI or the acceptance pulls from anonymously, so that one rule covers everything and `check` can
# demand an entry for every reference. Rate-limited by the owner's concern: public.ecr.aws, docker.io. Included for the same
# reason and at the same small cost: quay.io (Keycloak, cert-manager, Calico) and ghcr.io (CloudNativePG, Trivy). registry.k8s.io:
# nothing in the eight repositories references it (kind's nodes carry what they need), so it has no entry; the first reference
# needs one. NOT mirrored: our own images (ghcr.io/idp-xyz/<image>, built by platform.yml); ghcr.io/huggingface/text-embeddings-inference
# (idp-cmi's local embedding evaluation, tag built from a variable, never pulled by CI); the personal fallback mirrors in
# idp-eer's demo scripts (docker.m.daocloud.io, docker.1ms.run); Helm charts and manifests downloaded at run time (see README.md).
#
# `aliases`: other names of the same image that the repositories use today (docker.io/library/x is the ECR Public copy of x).
#
# resolvedVia: mirrors  -- the digest was looked up through two registry mirrors that agree (Docker Hub was not reachable), not on the
# source registry. The workflow proves it before it copies an entry for the first time: the source serves that digest, and the tag
# resolves to that digest on the source at that moment (a mismatch fails the entry with both digests). Once a run on GitHub has
# verified an entry, delete its resolvedVia line.
# A digest written as sha256:TODO is not resolved yet: `check` and the workflow fail on it. Fill it with
#   python3 tools/mirror_images.py resolve                                  (crane, a network that reaches the source registry)
#   python3 tools/mirror_images.py resolve --via docker.m.daocloud.io docker.1ms.run   (through mirrors, at least two must agree)
# Bumping an image: change tag and digest here (or put the new tag and sha256:TODO, then run resolve),
# merge, let the workflow copy, then change the references (python3 tools/mirror_images.py plan --repos ...).
images:

  # ---- Amazon ECR Public: Docker official images. docker.io/library/<name> is the same image (ECR Public syncs it), so the bare names that
  # idp-eer uses are aliases of these entries; the workflow warns when Docker Hub serves another digest for an alias.
  # the restore drills' client tools, every component's integration database
  - source: public.ecr.aws/docker/library/postgres@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    tag: "17-alpine"
    target: ghcr.io/idp-xyz/mirror:public.ecr.aws__docker__library__postgres__17-alpine
