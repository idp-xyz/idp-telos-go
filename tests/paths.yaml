# The platform acceptance paths, in the order deploy/compose/e2e.sh runs them (tests/ACCEPTANCE.md explains the tiers).
# Read by tools/acceptance.py (select, verify, report) and deploy/compose/lib_acceptance.sh; tools/tests/test_acceptance.py checks it against the scripts.
#
# Fields of a path
#   id              what PATHS="..." and `want ID` in e2e.sh / tests/kind/full.sh name; letters and digits only
#   pass            the PASS ids it prints, each as a line starting "PASS: PATH <id>" (verify wants every one of the selected paths)
#   components      what it exercises: the component repositories (and the platform image idp-embedding / the double); `select --changed` picks the
#                   paths whose components meet the changed set
#   needs           paths whose STATE it depends on (a variable, an agent or an app they create, a count they leave): selected with it, run before it
#   realEmbedding   PASS ids that need semantic similarity (a paraphrase with no shared word, a cross-language question): with EMBED=double they print
#                   "NOT_RUN: PATH <id> needs real embeddings (EMBED=double)" and verify accepts that; they are the T3 paths
#   t3              also in the T3 run with the real embedding image, though it needs no semantic similarity (it measures the real service's load)
#   budgetSeconds   measured on the compose acceptance with EMBED=double, plus headroom; over it only warns. realBudgetSeconds: with EMBED=real.
#                   kindBudgetSeconds: tests/kind/full.sh (EMBED=double, gVisor)
#   kind            tests/kind/full.sh runs it too; kindOrder gives the order there; kindExtras are PASS lines of kind that sit next to the path
#   script, files   what `select --changed auto` maps to the path: its script, and other files only it uses
#   uses, erases    the members whose accounts it uses and the ones it erases as subjects: a subject is never used after a path erased it
#                   (P0 erases bob, P2 erases carol: the order of this file is what keeps the rest working)
#
# `select --changed auto` (tools/acceptance.py): releases/platform-bom.yaml against the base (a component whose commit or image id moved is changed);
# a path script or a `files` entry selects that path; deploy/keycloak/**, deploy/compose/platform.yaml, e2e.sh, lib_acceptance.sh, tools/acceptance.py
# and this file select everything, and so does any other file under deploy/compose/ that no path claims. The smoke path A always runs.
version: 1
smoke: [A]
components: [idp-host, idp-cmi, idp-mcp, idp-sandbox, idp-web, idp-workspace, idp-eer, idp-mcp-bridge, idp-browser, idp-eii, idp-embedding, embedding-double]
kindOrder: [A, B, E, F, D, I, L, G, H, M, M2, M3, M4, M5, N, M6, O, P0, P1, P2, P3, C]
paths:
  - id: A
    pass: [A]
    components: [idp-host, idp-cmi, idp-workspace]
    needs: []
    uses: [bob]
    kind: true
    kindBudgetSeconds: 60
    budgetSeconds: 30
    notes: smoke. bob -> Workspace -> HOST -> CMI package -> inbox, and the three systems agree
  - id: B
    pass: [B]
    components: [idp-eer, idp-workspace]
    needs: []
    uses: [bob]
    kind: true
    kindBudgetSeconds: 60
    budgetSeconds: 30
    notes: a T2 execution waits in EER, the approver decides in the Workspace
  - id: D
    pass: [D]
    components: [idp-host, idp-mcp, idp-sandbox, idp-workspace]
    needs: []
    uses: [bob]
    kind: true
    kindBudgetSeconds: 60
    budgetSeconds: 30
  - id: I
    pass: [I]
    components: [idp-host, idp-workspace, idp-mcp, idp-sandbox]
    needs: []
    uses: [bob]
    kind: true
    kindBudgetSeconds: 60
    budgetSeconds: 30
  - id: J0
    pass: [J0]
    components: [idp-host, idp-mcp, idp-sandbox, idp-workspace]
    needs: []
    uses: [bob]
    budgetSeconds: 45
    notes: creates the officecli skill, office-assistant and the office app that J uses
  - id: J
    pass: [J]
    components: [idp-host, idp-mcp, idp-sandbox, idp-workspace]
    needs: [J0]
    uses: [bob]
    budgetSeconds: 45
  - id: K
    pass: [K]
    components: [idp-host, idp-workspace, idp-mcp]
    needs: []
