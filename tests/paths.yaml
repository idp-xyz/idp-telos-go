    kind: true
    kindBudgetSeconds: 240
    budgetSeconds: 180
    script: deploy/compose/path_o.sh
    files: [deploy/compose/bridge_check.py, deploy/compose/bridge_setup.py, deploy/compose/thirdparty_double.py]
  - id: P0
    pass: [P0a, P0b, P0c, P0d, P0e, P0f, P0g]
