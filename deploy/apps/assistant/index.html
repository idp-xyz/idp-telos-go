<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="agents" role="tablist" aria-label="agent">
    <button type="button" role="tab" data-action="ask" aria-selected="true">订单助手</button>
    <button type="button" role="tab" data-action="code" aria-selected="false">代码助手</button>
    <button type="button" role="tab" data-action="chat" aria-selected="false">记忆助手</button>
  </div>
  <button type="button" id="fresh" title="开始一次新的对话：助手不再带着这次对话的历史（企业记忆仍在）">新对话</button>
  <span id="where" class="muted"></span>
</header>
<p id="hint" class="muted"></p>
<ol id="chat" aria-live="polite"></ol>
<form id="ask">
  <textarea id="message" rows="3" aria-label="消息"></textarea>
  <button type="submit" id="send">发送</button>
</form>
<script src="app.js"></script>
</body>
</html>
