# The IDP TELOS platform for acceptance (docs/adr/ADR-0001-platform-integration.md T5): one
# PostgreSQL (a database per component), Keycloak (deploy/keycloak/realm.py), idp-cmi, idp-host (with
# its worker and model double) and idp-workspace, each the image its own repository builds
# (releases/platform-bom.yaml records their ids). Driven by deploy/compose/e2e.sh.
# Keycloak's issuer is https://127.0.0.1:7443/realms/idp (a CA generated per run in .local/platform/tls),
# because idp-eer accepts only https issuers; containers fetch keys and tokens from http://keycloak:7080.
# idp-eer runs from its offline image with Temporal (P2). The browser uses 127.0.0.1:{7443, 8560}.
# P4: the idp-mcp registry and gateway (jwt mode, Keycloak) and idp-sandbox as an upstream with identity
# forwarding; the HOST reaches the gateway with RFC 8693 delegation. The sandbox mounts the Docker socket (root on
# the host): development only, see idp-sandbox ADR-0001 section 5.
# The sandbox comes with its egress proxy (idp-sandbox ADR-0001 D13, D21): a run may ask for network=egress and then
# reaches the hosts on its tenant's allow-list (.local/platform/egress-tenants.yaml) through the proxy, and nothing else.
# idp-web (platform ADR-0003) is a second upstream of the gateway, for web search and page reading; its search provider is the fixture and
# its pages come from two test containers that record requests (profile web-test), so that PATH M and N need no internet.
# DEV ONLY: a test realm and CA, plaintext http on private networks.
name: idp-telos-platform

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

x-oidc: &oidc
  IDP_DEV_MODE: 'false'

networks:
  edge: {}
  upstream: {internal: true}
  data: {internal: true}

volumes:
  pgdata: {}
  filesdata: {}

services:
  postgres:
    image: ${IDP_PG_IMAGE:-pgvector/pgvector:0.8.7-pg17}
    networks: [data]
    environment: {POSTGRES_PASSWORD: '${IDP_PG_OWNER_PASSWORD:?run deploy/compose/e2e.sh}'}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres'], interval: 2s, timeout: 3s, retries: 30}

  # members' file contents (idp-workspace D24): a RustFS of their own, not the database backups' store, so that the
  # Workspace's keys reach nothing else; server-side encryption with a master key generated per stack. The loopback port
  # is for e2e.sh (the bucket, and its checks); a published port needs a network that is not internal, hence edge.
  files-s3:
    image: ${IDP_FILES_S3_IMAGE:-docker.io/rustfs/rustfs:1.0.4-glibc}
    networks: [data, edge]
    ports: ['127.0.0.1:19500:9000']
    environment:
      RUSTFS_ACCESS_KEY: ${IDP_FILES_S3_ACCESS_KEY:?run deploy/compose/e2e.sh}
      RUSTFS_SECRET_KEY: ${IDP_FILES_S3_SECRET_KEY:?run deploy/compose/e2e.sh}
      RUSTFS_REGION: us-east-1
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_SSE_S3_MASTER_KEY: ${IDP_FILES_S3_MASTER_KEY:?run deploy/compose/e2e.sh}
    volumes: [filesdata:/data]

  keycloak:
    image: ${IDP_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2}
    command: [start-dev, --import-realm, --features, 'token-exchange-standard']
    networks: [edge, upstream]
    ports: ['127.0.0.1:7443:7443']
    environment:
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '7080'
      KC_HTTPS_PORT: '7443'
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/tls/server.key
      KC_HOSTNAME: https://127.0.0.1:7443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run deploy/compose/e2e.sh}
    volumes: ['../../.local/platform/keycloak:/opt/keycloak/data/import:ro', '../../.local/platform/tls:/opt/keycloak/tls:ro']

  # ---- idp-cmi ----
  cmi-admin:
    <<: *hardened
    image: ${IDP_CMI_IMAGE:-idp-cmi:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_cmi?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_CMI_DB_PASSWORD:?run deploy/compose/e2e.sh}
  cmi:
    <<: *hardened
    image: ${IDP_CMI_IMAGE:-idp-cmi:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8550:8550']
    environment:
      <<: *oidc
      IDP_DATABASE_URL: postgres://idp_cmi_svc:${IDP_CMI_DB_PASSWORD}@postgres:5432/idp_cmi?sslmode=disable
      IDP_CMI_LISTEN: 0.0.0.0:8550
      IDP_CMI_ISSUER: https://127.0.0.1:7443/realms/idp
      IDP_CMI_JWKS_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/certs
      IDP_CMI_ALLOW_INSECURE_JWKS: 'true'   # DEV: Keycloak over plain http on the compose network; production serves the keys over https (idp-cmi D42)
      IDP_CMI_AUDIENCE: idp-cmi

  # ---- idp-mcp (registry, gateway) and idp-sandbox (P4) ----
  mcp-admin:
    <<: *hardened
    image: ${IDP_MCP_IMAGE:-idp-mcp:dev}
    profiles: [tools]
    entrypoint: [/usr/local/bin/registry-service]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_mcp?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_MCP_DB_PASSWORD:?run deploy/compose/e2e.sh}
      IDP_DEV_MODE: 'true'
      IDP_DEV_ADMIN_SECRET: ${IDP_MCP_ADMIN_SECRET:?run deploy/compose/e2e.sh}
  mcp-registry:
    <<: *hardened
    image: ${IDP_MCP_IMAGE:-idp-mcp:dev}
    entrypoint: [/usr/local/bin/registry-service]
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8250:8250']
    environment:
      IDP_DATABASE_URL: postgres://idp_mcp_svc:${IDP_MCP_DB_PASSWORD}@postgres:5432/idp_mcp?sslmode=disable
      IDP_REGISTRY_LISTEN: 0.0.0.0:8250
      IDP_DEV_MODE: 'true'   # HS256 admin tokens (dev-token); the data plane below verifies Keycloak tokens
      IDP_DEV_ADMIN_SECRET: ${IDP_MCP_ADMIN_SECRET}
      IDP_ALLOWED_UPSTREAM_HOSTS: sandbox,web
      IDP_PRIVATE_UPSTREAM_HOSTS: sandbox,web
  mcp-gateway:
    <<: *hardened
    image: ${IDP_MCP_IMAGE:-idp-mcp:dev}
    entrypoint: [/usr/local/bin/mcp-gateway]
    networks: [edge, upstream]
    ports: ['127.0.0.1:3320:3320']
    tmpfs: ['/var/cache/idp:uid=10001,gid=10001,mode=0700']
    environment:
      IDP_GATEWAY_ID: ${IDP_GATEWAY_ID:-pending}
      IDP_GATEWAY_TOKEN: ${IDP_GATEWAY_TOKEN:-pending}
      IDP_REGISTRY_URL: http://mcp-registry:8250
      IDP_GATEWAY_LISTEN: 0.0.0.0:3320
      IDP_GATEWAY_ALLOWED_HOSTS: mcp-gateway,mcp-gateway:3320   # the HOST calls it by service name
      IDP_RELEASE_CACHE: /var/cache/idp/release.json
      IDP_METRICS_LISTEN: 0.0.0.0:9464
      # the gateway signs the caller it forwards to the sandbox and to web (idp-mcp D44); both hold the public half
      IDP_GATEWAY_CALLER_KEY_FILE: /etc/idp/caller.key
      # the OAuth clients the gateway serves, which is the HOST, and the tools only the HOST may call (idp-mcp ADR-0001 D46 to D48):
      # the gateway does not start without it; written by deploy/compose/e2e.sh
      IDP_GATEWAY_CLIENTS_FILE: /etc/idp/clients.yaml
    volumes: ['../../.local/platform/caller.key:/etc/idp/caller.key:ro', '../../.local/platform/gateway-clients.yaml:/etc/idp/clients.yaml:ro']
    depends_on: [mcp-registry]
  sandbox:
    <<: *hardened
    image: ${IDP_SANDBOX_IMAGE:-idp-sandbox:dev}
    networks: [upstream]
    volumes: [/var/run/docker.sock:/var/run/docker.sock, '../../.local/platform/caller.pub:/etc/idp/gateway.pub:ro', '../../.local/platform/egress.key:/etc/idp/egress.key:ro']
    environment:
      IDP_SANDBOX_LISTEN: 0.0.0.0:8570
      IDP_SANDBOX_PRIVATE_NETWORK: 'true'
      # a call counts as its caller's only with the gateway's signature, made for this endpoint (idp-sandbox D18)
      IDP_SANDBOX_CALLER_KEYS_FILE: /etc/idp/gateway.pub
      IDP_SANDBOX_CALLER_AUDIENCE: http://sandbox:8570/mcp
      IDP_SANDBOX_METRICS: 0.0.0.0:9570
      IDP_SANDBOX_OWNER: platform
      IDP_SANDBOX_PYTHON_IMAGE: ${IDP_SANDBOX_PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
      IDP_SANDBOX_SHELL_IMAGE: ${IDP_SANDBOX_SHELL_IMAGE:-public.ecr.aws/docker/library/alpine:3.22}
      IDP_SANDBOX_OFFICE_IMAGE: ${IDP_SANDBOX_OFFICE_IMAGE:-idp-sandbox-office:dev}
      # a member's files move between the Workspace and a workspace on the Workspace's internal listener (idp-sandbox D15)
      IDP_SANDBOX_FILES_URL: http://workspace:8561/internal/v1/files
      # network=egress for runs (D13): the proxy's container, which the sandbox attaches to a run's own internal network;
      # each run's proxy address carries a credential that says the caller's tenant (D21), signed with the key the two share
      IDP_SANDBOX_EGRESS_PROXY: ${COMPOSE_PROJECT_NAME}-sandbox-egress-1
      IDP_SANDBOX_EGRESS_KEY_FILE: /etc/idp/egress.key
    depends_on: [sandbox-egress]
  # The sandbox's egress proxy: the only way out for a run that asked for network=egress. It takes only runs that show the
  # sandbox's credential and lets a tenant reach the hosts of its own list (egress-tenants.yaml; a tenant that is not
  # named gets `default`, and without one nothing). It refuses private, loopback and link-local addresses.
  sandbox-egress:
    <<: *hardened
    image: ${IDP_SANDBOX_EGRESS_IMAGE:-idp-sandbox-egress:dev}
    networks: [edge]
    volumes: ['../../.local/platform/egress.key:/etc/idp/egress.key:ro', '../../.local/platform/egress-tenants.yaml:/etc/idp/tenants.yaml:ro']
    environment:
      IDP_EGRESS_HOSTS: ''
      IDP_EGRESS_KEY_FILE: /etc/idp/egress.key
      IDP_EGRESS_TENANTS_FILE: /etc/idp/tenants.yaml
      # TESTS ONLY (deploy/compose/e2e.sh sets it): PATH L's origin is a container of this project, at a private address
      IDP_EGRESS_ALLOW_PRIVATE: ${IDP_EGRESS_ALLOW_PRIVATE:-false}
  # TEST ONLY (profile egress-test, which deploy/compose/e2e.sh turns on): the host PATH L puts on the tenant's allow-list,
  # so that the path does not depend on the internet
  egress-origin:
    <<: *hardened
    profiles: [egress-test]
    image: ${IDP_SANDBOX_PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    networks: [edge]
    user: '65532:65532'
    environment: {PYTHONDONTWRITEBYTECODE: '1'}
    command:
      - python
      - -c
      - |
        import http.server, socketserver
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(s):
                s.send_response(200); s.end_headers(); s.wfile.write(b'hello from the egress origin')
            def log_message(*a): pass
        socketserver.ThreadingTCPServer.allow_reuse_address = True
        socketserver.ThreadingTCPServer(('0.0.0.0', 80), H).serve_forever()

  # idp-web (platform ADR-0003): the agents' search and page reading. The gateway reaches it on upstream (internal: nothing else
  # does, which is what IDP_WEB_PRIVATE_NETWORK says) and it goes out to the web over edge, the same network the sandbox's egress
  # proxy uses. A call counts as its caller's only with the gateway's signature, made for this endpoint (idp-web D2). Keys, the
  # tenants file and the fixture search results are generated per run by deploy/compose/e2e.sh; the provider is the fixture, so
  # that the acceptance does not depend on the internet or on a search service's key.
  web:
    <<: *hardened
    image: ${IDP_WEB_IMAGE:-idp-web:dev}
    networks: [upstream, edge, data]   # data: the database of the daily quota and the source numbers (idp-web D28, D29)
    volumes: ['../../.local/platform/caller.pub:/etc/idp/gateway.pub:ro', '../../.local/platform/web-ref.key:/etc/idp/ref.key:ro',
              '../../.local/platform/web-tenants.yaml:/etc/idp/tenants.yaml:ro', '../../.local/platform/web-fixture.yaml:/etc/idp/fixture.yaml:ro']
    environment:
      IDP_WEB_LISTEN: 0.0.0.0:8580
      IDP_WEB_PRIVATE_NETWORK: 'true'
      IDP_WEB_CALLER_KEYS_FILE: /etc/idp/gateway.pub
      IDP_WEB_CALLER_AUDIENCE: http://web:8580/mcp
      IDP_WEB_PROVIDER: fixture
      IDP_WEB_FIXTURE_FILE: /etc/idp/fixture.yaml
      IDP_WEB_REF_KEY_FILE: /etc/idp/ref.key
      IDP_WEB_TENANTS_FILE: /etc/idp/tenants.yaml
      IDP_WEB_DATABASE_URL: postgres://idp_web_svc:${IDP_WEB_DB_PASSWORD:?run deploy/compose/e2e.sh}@postgres:5432/idp_web?sslmode=disable
      # TESTS ONLY (deploy/compose/e2e.sh sets it): the two test origins below are containers of this project, at private
      # addresses on port 80 (idp-web D14); nothing else is exempt
      IDP_WEB_TEST_ORIGINS: ${IDP_WEB_TEST_ORIGINS:-}
  # idp-web's database tasks (idp-web ADR-0001 D29), as mcp-admin is idp-mcp's: `migrate` as the owner, `ensure-login idp_web_svc`.
  web-admin:
    <<: *hardened
    image: ${IDP_WEB_IMAGE:-idp-web:dev}
    profiles: [tools]
    entrypoint: [/idp-web]
    networks: [data]
    environment:
      IDP_WEB_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_web?sslmode=disable
      IDP_WEB_APP_DB_PASSWORD: ${IDP_WEB_DB_PASSWORD:?run deploy/compose/e2e.sh}
  # TEST ONLY (profile web-test, which deploy/compose/e2e.sh turns on): the two origins of PATH M and N, which record every
  # request (deploy/compose/web_origin.py). `web-origin` is what the fixture search results point at; `web-attacker` is the
  # address a page tells the reader to send data to. They are two containers, not two names of one, so that "the attacker
  # was never asked for anything" is "this container's log has no request", whatever the origin's own log says.
  web-origin: &web-test-origin
    <<: *hardened
    profiles: [web-test]
    image: ${IDP_SANDBOX_PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    networks: [edge]
    user: '65532:65532'
    environment: {PYTHONDONTWRITEBYTECODE: '1'}
    volumes: ['./web_origin.py:/srv/web_origin.py:ro']
    command: [python, -I, /srv/web_origin.py, origin]
  web-attacker:
    <<: *web-test-origin
    command: [python, -I, /srv/web_origin.py, attacker]

  # ---- idp-host ----
  fakemodel:
    <<: *hardened
    image: ${IDP_FAKEMODEL_IMAGE:-idp-host-fakemodel:dev}
    networks: [upstream]
    environment: {IDP_FAKEMODEL_LISTEN: '0.0.0.0:18080'}
  host-admin:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_host?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_HOST_DB_PASSWORD:?run deploy/compose/e2e.sh}
  host:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8450:8450']
    environment: &host-env
      IDP_DEV_MODE: 'true'   # only so the HOST talks plaintext http to its model double; tokens still come from Keycloak (JWKS)
      IDP_DATABASE_URL: postgres://idp_host_svc:${IDP_HOST_DB_PASSWORD}@postgres:5432/idp_host?sslmode=disable
      IDP_HOST_LISTEN: 0.0.0.0:8450
      IDP_HOST_ISSUER: https://127.0.0.1:7443/realms/idp
      IDP_HOST_JWKS_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/certs
      IDP_HOST_CREDENTIAL_KEY: ${IDP_HOST_CREDENTIAL_KEY:?run deploy/compose/e2e.sh}
      IDP_HOST_CONFIG: /etc/idp/host.yaml
      IDP_HOST_WORKERS: '0'
    volumes: ['../../.local/platform/host.yaml:/etc/idp/host.yaml:ro', '../../.local/platform/cmi-client.secret:/etc/idp/cmi-client.secret:ro', '../../.local/platform/host.key:/etc/idp/host.key:ro', '../../.local/platform/live-model.key:/etc/idp/live-model.key:ro']
    extra_hosts: ['host.docker.internal:host-gateway']   # MODEL=live: the model forwarder on the Docker host
    depends_on: [fakemodel, cmi]
  host-worker:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    command: [worker]
    networks: [edge, upstream, data]   # edge: MODEL=live reaches the model on the Docker host
    environment:
      <<: *host-env
      IDP_HOST_WORKERS: '2'
    volumes: ['../../.local/platform/host.yaml:/etc/idp/host.yaml:ro', '../../.local/platform/cmi-client.secret:/etc/idp/cmi-client.secret:ro', '../../.local/platform/host.key:/etc/idp/host.key:ro', '../../.local/platform/live-model.key:/etc/idp/live-model.key:ro']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on: [fakemodel, cmi]

  # ---- idp-workspace ----
  workspace-admin:
    <<: *hardened
    image: ${IDP_WORKSPACE_IMAGE:-idp-workspace:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_workspace?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_WORKSPACE_DB_PASSWORD:?run deploy/compose/e2e.sh}
  workspace:
    <<: *hardened
    image: ${IDP_WORKSPACE_IMAGE:-idp-workspace:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8560:8560']
    environment:
      IDP_DEV_MODE: 'true'   # only for the ephemeral app-token key; tokens come from Keycloak (JWKS)
      IDP_DATABASE_URL: postgres://idp_ws_svc:${IDP_WORKSPACE_DB_PASSWORD}@postgres:5432/idp_workspace?sslmode=disable
      IDP_WORKSPACE_LISTEN: 0.0.0.0:8560
      IDP_WORKSPACE_ISSUER: https://127.0.0.1:7443/realms/idp
      IDP_WORKSPACE_JWKS_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/certs
      IDP_WORKSPACE_OIDC_CLIENT_ID: workspace-shell
      IDP_WORKSPACE_SUBJECT_CLAIM: preferred_username
      IDP_WORKSPACE_PUBLIC_URL: http://127.0.0.1:8560
      # the internal file endpoint for idp-sandbox (idp-workspace D23): file tickets for host.run; not published to the host
      IDP_WORKSPACE_INTERNAL_LISTEN: 0.0.0.0:8561
      IDP_WORKSPACE_CONFIG: /etc/idp/workspace.yaml
      # file contents in the object store (idp-workspace D24), checked against their SHA-256 on every read
      IDP_WORKSPACE_FILE_STORE: s3
      IDP_WORKSPACE_S3_ENDPOINT: http://files-s3:9000
      IDP_WORKSPACE_S3_BUCKET: member-files
      IDP_WORKSPACE_S3_ACCESS_KEY_FILE: /etc/idp/files-s3.access
      IDP_WORKSPACE_S3_SECRET_KEY_FILE: /etc/idp/files-s3.secret
    volumes: ['../../.local/platform/workspace.yaml:/etc/idp/workspace.yaml:ro', '../../.local/platform/exchange.secret:/etc/idp/exchange.secret:ro',
              '../../.local/platform/files-s3.access:/etc/idp/files-s3.access:ro', '../../.local/platform/files-s3.secret:/etc/idp/files-s3.secret:ro']
    depends_on: [host, files-s3]

  # ---- idp-eer (image: idp-eer tools/development/runtime_image_offline.sh) ----
  eer-temporal:
    image: ${EER_TEMPORAL_IMAGE:-local/temporal:1.10.0}
    command: [server, start-dev, --ip, 0.0.0.0, --headless]
    networks: [data]
  eer-migrate:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    profiles: [tools]
    command: [eer-migrate]
    networks: [data]
    environment:
      EER_MIGRATION_PG_DSN: postgresql://eer_runtime_owner:${EER_RUNTIME_OWNER_PASSWORD:?run deploy/compose/e2e.sh}@postgres:5432/eer?sslmode=disable
  eer-configure:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    profiles: [tools]
    command: [eer-configure]
    networks: [data]
    volumes: ['../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: &eer-dsn postgresql://eer_runtime_app:${EER_RUNTIME_APP_PASSWORD:?run deploy/compose/e2e.sh}@postgres:5432/eer?sslmode=disable
      EER_TENANT_ID: pilot
      EER_WORKLOAD_ISSUER: urn:eer:workload
      EER_WORKLOAD_SUBJECT: eer-configure
  eer-api:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    command: [eer-api]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:18180:8080']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: *eer-dsn
      EER_TEMPORAL_TARGET: eer-temporal:7233
      EER_TENANT_ID: pilot
      EER_HTTP_ADDRESS: ':8080'
    volumes: ['../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
    depends_on: [eer-temporal]
  eer-worker:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    command: [eer-worker]
    networks: [edge, data]
    ports: ['127.0.0.1:18181:8081']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: *eer-dsn
      EER_TEMPORAL_TARGET: eer-temporal:7233
      EER_TENANT_ID: pilot
      EER_HEALTH_ADDRESS: ':8081'
      EER_WORKLOAD_ISSUER: urn:eer:workload
      EER_WORKLOAD_SUBJECT: eer-worker
      EER_EXECUTION_INVOKER_MODE: conformance   # EER's deterministic Actor harness; no real connectors in the platform
    volumes: ['../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
    depends_on: [eer-temporal]
  eer-projector:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    command: [eer-projector]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:18182:8082']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: *eer-dsn
      EER_TENANT_ID: pilot
      EER_HEALTH_ADDRESS: ':8082'
      EER_WORKLOAD_ISSUER: urn:eer:workload
      EER_WORKLOAD_SUBJECT: eer-projector
      EER_PROJECTOR_POLL_INTERVAL: 250ms
      # idp-eer ADR-038: approval waits into the Workspace inbox, as the producer svc-eer
      EER_WORKSPACE_INBOX_URL: http://workspace:8560
      EER_WORKSPACE_INBOX_WORKSPACE: us-ops
      EER_WORKSPACE_INBOX_APP: eer-approvals
      EER_WORKSPACE_INBOX_ROLES: approver
      EER_WORKSPACE_INBOX_TOKEN_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/token
      EER_WORKSPACE_INBOX_CLIENT_ID: svc-eer
      EER_WORKSPACE_INBOX_CLIENT_SECRET_FILE: /etc/eer/svc-eer.secret
    volumes: ['../../.local/platform/svc-eer.secret:/etc/eer/svc-eer.secret:ro', '../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
