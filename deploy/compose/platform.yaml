# The IDP TELOS platform for acceptance (docs/adr/ADR-0001-platform-integration.md T5): one
# PostgreSQL (a database per component), Keycloak (deploy/keycloak/realm.py), idp-cmi, idp-host (with
# its worker and model double) and idp-workspace, each the image its own repository builds
# (releases/platform-bom.yaml records their ids). Driven by deploy/compose/e2e.sh.
# Keycloak's issuer is https://127.0.0.1:7443/realms/idp (a CA generated per run in .local/platform/tls),
# because idp-eer accepts only https issuers; containers fetch keys and tokens from http://keycloak:7080.
# idp-eer runs from its offline image with Temporal (P2). The browser uses 127.0.0.1:{7443, 8560}.
# P4: the idp-mcp registry and gateway (jwt mode, Keycloak) and idp-sandbox as an upstream with identity
# forwarding; the HOST reaches the gateway with RFC 8693 delegation. The sandbox mounts the Docker socket (root on
# the host): development only, see idp-sandbox ADR-0001 section 5.
# DEV ONLY: a test realm and CA, plaintext http on private networks.
name: idp-telos-platform

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

x-oidc: &oidc
  IDP_DEV_MODE: 'false'

networks:
  edge: {}
  upstream: {internal: true}
  data: {internal: true}

volumes:
  pgdata: {}

services:
  postgres:
    image: ${IDP_PG_IMAGE:-pgvector/pgvector:0.8.7-pg17}
    networks: [data]
    environment: {POSTGRES_PASSWORD: '${IDP_PG_OWNER_PASSWORD:?run deploy/compose/e2e.sh}'}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres'], interval: 2s, timeout: 3s, retries: 30}

  keycloak:
    image: ${IDP_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2}
    command: [start-dev, --import-realm, --features, 'token-exchange-standard']
    networks: [edge, upstream]
    ports: ['127.0.0.1:7443:7443']
    environment:
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '7080'
      KC_HTTPS_PORT: '7443'
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/tls/server.key
      KC_HOSTNAME: https://127.0.0.1:7443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run deploy/compose/e2e.sh}
    volumes: ['../../.local/platform/keycloak:/opt/keycloak/data/import:ro', '../../.local/platform/tls:/opt/keycloak/tls:ro']

  # ---- idp-cmi ----
  cmi-admin:
    <<: *hardened
    image: ${IDP_CMI_IMAGE:-idp-cmi:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_cmi?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_CMI_DB_PASSWORD:?run deploy/compose/e2e.sh}
  cmi:
    <<: *hardened
    image: ${IDP_CMI_IMAGE:-idp-cmi:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8550:8550']
    environment:
      <<: *oidc
      IDP_DATABASE_URL: postgres://idp_cmi_svc:${IDP_CMI_DB_PASSWORD}@postgres:5432/idp_cmi?sslmode=disable
      IDP_CMI_LISTEN: 0.0.0.0:8550
      IDP_CMI_ISSUER: https://127.0.0.1:7443/realms/idp
      IDP_CMI_JWKS_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/certs
      IDP_CMI_ALLOW_INSECURE_JWKS: 'true'   # DEV: Keycloak over plain http on the compose network; production serves the keys over https (idp-cmi D42)
      IDP_CMI_AUDIENCE: idp-cmi

  # ---- idp-mcp (registry, gateway) and idp-sandbox (P4) ----
  mcp-admin:
    <<: *hardened
    image: ${IDP_MCP_IMAGE:-idp-mcp:dev}
    profiles: [tools]
    entrypoint: [/usr/local/bin/registry-service]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_mcp?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_MCP_DB_PASSWORD:?run deploy/compose/e2e.sh}
      IDP_DEV_MODE: 'true'
      IDP_DEV_ADMIN_SECRET: ${IDP_MCP_ADMIN_SECRET:?run deploy/compose/e2e.sh}
  mcp-registry:
    <<: *hardened
    image: ${IDP_MCP_IMAGE:-idp-mcp:dev}
    entrypoint: [/usr/local/bin/registry-service]
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8250:8250']
    environment:
      IDP_DATABASE_URL: postgres://idp_mcp_svc:${IDP_MCP_DB_PASSWORD}@postgres:5432/idp_mcp?sslmode=disable
      IDP_REGISTRY_LISTEN: 0.0.0.0:8250
      IDP_DEV_MODE: 'true'   # HS256 admin tokens (dev-token); the data plane below verifies Keycloak tokens
      IDP_DEV_ADMIN_SECRET: ${IDP_MCP_ADMIN_SECRET}
      IDP_ALLOWED_UPSTREAM_HOSTS: sandbox
      IDP_PRIVATE_UPSTREAM_HOSTS: sandbox
  mcp-gateway:
    <<: *hardened
    image: ${IDP_MCP_IMAGE:-idp-mcp:dev}
    entrypoint: [/usr/local/bin/mcp-gateway]
    networks: [edge, upstream]
    ports: ['127.0.0.1:3320:3320']
    tmpfs: ['/var/cache/idp:uid=10001,gid=10001,mode=0700']
    environment:
      IDP_GATEWAY_ID: ${IDP_GATEWAY_ID:-pending}
      IDP_GATEWAY_TOKEN: ${IDP_GATEWAY_TOKEN:-pending}
      IDP_REGISTRY_URL: http://mcp-registry:8250
      IDP_GATEWAY_LISTEN: 0.0.0.0:3320
      IDP_GATEWAY_ALLOWED_HOSTS: mcp-gateway,mcp-gateway:3320   # the HOST calls it by service name
      IDP_RELEASE_CACHE: /var/cache/idp/release.json
      IDP_METRICS_LISTEN: 0.0.0.0:9464
    depends_on: [mcp-registry]
  sandbox:
    <<: *hardened
    image: ${IDP_SANDBOX_IMAGE:-idp-sandbox:dev}
    networks: [upstream]
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    environment:
      IDP_SANDBOX_LISTEN: 0.0.0.0:8570
      IDP_SANDBOX_PRIVATE_NETWORK: 'true'
      IDP_SANDBOX_METRICS: 0.0.0.0:9570
      IDP_SANDBOX_OWNER: platform
      IDP_SANDBOX_PYTHON_IMAGE: ${IDP_SANDBOX_PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
      IDP_SANDBOX_SHELL_IMAGE: ${IDP_SANDBOX_SHELL_IMAGE:-public.ecr.aws/docker/library/alpine:3.22}

  # ---- idp-host ----
  fakemodel:
    <<: *hardened
    image: ${IDP_FAKEMODEL_IMAGE:-idp-host-fakemodel:dev}
    networks: [upstream]
    environment: {IDP_FAKEMODEL_LISTEN: '0.0.0.0:18080'}
  host-admin:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_host?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_HOST_DB_PASSWORD:?run deploy/compose/e2e.sh}
  host:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8450:8450']
    environment: &host-env
      IDP_DEV_MODE: 'true'   # only so the HOST talks plaintext http to its model double; tokens still come from Keycloak (JWKS)
      IDP_DATABASE_URL: postgres://idp_host_svc:${IDP_HOST_DB_PASSWORD}@postgres:5432/idp_host?sslmode=disable
      IDP_HOST_LISTEN: 0.0.0.0:8450
      IDP_HOST_ISSUER: https://127.0.0.1:7443/realms/idp
      IDP_HOST_JWKS_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/certs
      IDP_HOST_CREDENTIAL_KEY: ${IDP_HOST_CREDENTIAL_KEY:?run deploy/compose/e2e.sh}
      IDP_HOST_CONFIG: /etc/idp/host.yaml
      IDP_HOST_WORKERS: '0'
    volumes: ['../../.local/platform/host.yaml:/etc/idp/host.yaml:ro', '../../.local/platform/cmi.key:/etc/idp/cmi.key:ro', '../../.local/platform/host.key:/etc/idp/host.key:ro']
    extra_hosts: ['host.docker.internal:host-gateway']   # MODEL=live: the model forwarder on the Docker host
    depends_on: [fakemodel, cmi]
  host-worker:
    <<: *hardened
    image: ${IDP_HOST_IMAGE:-idp-host:dev}
    command: [worker]
    networks: [edge, upstream, data]   # edge: MODEL=live reaches the model on the Docker host
    environment:
      <<: *host-env
      IDP_HOST_WORKERS: '2'
    volumes: ['../../.local/platform/host.yaml:/etc/idp/host.yaml:ro', '../../.local/platform/cmi.key:/etc/idp/cmi.key:ro', '../../.local/platform/host.key:/etc/idp/host.key:ro']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on: [fakemodel, cmi]

  # ---- idp-workspace ----
  workspace-admin:
    <<: *hardened
    image: ${IDP_WORKSPACE_IMAGE:-idp-workspace:dev}
    profiles: [tools]
    networks: [data]
    environment:
      IDP_MIGRATION_DATABASE_URL: postgres://postgres:${IDP_PG_OWNER_PASSWORD}@postgres:5432/idp_workspace?sslmode=disable
      IDP_APP_DB_PASSWORD: ${IDP_WORKSPACE_DB_PASSWORD:?run deploy/compose/e2e.sh}
  workspace:
    <<: *hardened
    image: ${IDP_WORKSPACE_IMAGE:-idp-workspace:dev}
    command: [serve]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:8560:8560']
    environment:
      IDP_DEV_MODE: 'true'   # only for the ephemeral app-token key; tokens come from Keycloak (JWKS)
      IDP_DATABASE_URL: postgres://idp_ws_svc:${IDP_WORKSPACE_DB_PASSWORD}@postgres:5432/idp_workspace?sslmode=disable
      IDP_WORKSPACE_LISTEN: 0.0.0.0:8560
      IDP_WORKSPACE_ISSUER: https://127.0.0.1:7443/realms/idp
      IDP_WORKSPACE_JWKS_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/certs
      IDP_WORKSPACE_OIDC_CLIENT_ID: workspace-shell
      IDP_WORKSPACE_SUBJECT_CLAIM: preferred_username
      IDP_WORKSPACE_PUBLIC_URL: http://127.0.0.1:8560
      IDP_WORKSPACE_CONFIG: /etc/idp/workspace.yaml
    volumes: ['../../.local/platform/workspace.yaml:/etc/idp/workspace.yaml:ro', '../../.local/platform/exchange.secret:/etc/idp/exchange.secret:ro']
    depends_on: [host]

  # ---- idp-eer (image: idp-eer tools/development/runtime_image_offline.sh) ----
  eer-temporal:
    image: ${EER_TEMPORAL_IMAGE:-local/temporal:1.7.3}
    command: [server, start-dev, --ip, 0.0.0.0, --headless]
    networks: [data]
  eer-migrate:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    profiles: [tools]
    command: [eer-migrate]
    networks: [data]
    environment:
      EER_MIGRATION_PG_DSN: postgresql://eer_runtime_owner:${EER_RUNTIME_OWNER_PASSWORD:?run deploy/compose/e2e.sh}@postgres:5432/eer?sslmode=disable
  eer-configure:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    profiles: [tools]
    command: [eer-configure]
    networks: [data]
    volumes: ['../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: &eer-dsn postgresql://eer_runtime_app:${EER_RUNTIME_APP_PASSWORD:?run deploy/compose/e2e.sh}@postgres:5432/eer?sslmode=disable
      EER_TENANT_ID: pilot
      EER_WORKLOAD_ISSUER: urn:eer:workload
      EER_WORKLOAD_SUBJECT: eer-configure
  eer-api:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    command: [eer-api]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:18180:8080']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: *eer-dsn
      EER_TEMPORAL_TARGET: eer-temporal:7233
      EER_TENANT_ID: pilot
      EER_HTTP_ADDRESS: ':8080'
    volumes: ['../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
    depends_on: [eer-temporal]
  eer-worker:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    command: [eer-worker]
    networks: [edge, data]
    ports: ['127.0.0.1:18181:8081']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: *eer-dsn
      EER_TEMPORAL_TARGET: eer-temporal:7233
      EER_TENANT_ID: pilot
      EER_HEALTH_ADDRESS: ':8081'
      EER_WORKLOAD_ISSUER: urn:eer:workload
      EER_WORKLOAD_SUBJECT: eer-worker
      EER_EXECUTION_INVOKER_MODE: conformance   # EER's deterministic Actor harness; no real connectors in the platform
    volumes: ['../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
    depends_on: [eer-temporal]
  eer-projector:
    <<: *hardened
    image: ${EER_RUNTIME_IMAGE:-eer-runtime:dev}
    command: [eer-projector]
    networks: [edge, upstream, data]
    ports: ['127.0.0.1:18182:8082']
    env_file: ['../../.local/platform/eer.env']
    environment:
      EER_PG_DSN: *eer-dsn
      EER_TENANT_ID: pilot
      EER_HEALTH_ADDRESS: ':8082'
      EER_WORKLOAD_ISSUER: urn:eer:workload
      EER_WORKLOAD_SUBJECT: eer-projector
      EER_PROJECTOR_POLL_INTERVAL: 250ms
      # idp-eer ADR-038: approval waits into the Workspace inbox, as the producer svc-eer
      EER_WORKSPACE_INBOX_URL: http://workspace:8560
      EER_WORKSPACE_INBOX_WORKSPACE: us-ops
      EER_WORKSPACE_INBOX_APP: eer-approvals
      EER_WORKSPACE_INBOX_ROLES: approver
      EER_WORKSPACE_INBOX_TOKEN_URL: http://keycloak:7080/realms/idp/protocol/openid-connect/token
      EER_WORKSPACE_INBOX_CLIENT_ID: svc-eer
      EER_WORKSPACE_INBOX_CLIENT_SECRET_FILE: /etc/eer/svc-eer.secret
    volumes: ['../../.local/platform/svc-eer.secret:/etc/eer/svc-eer.secret:ro', '../../.local/platform/tls/ca.crt:/etc/eer/ca.crt:ro']
