# kind only: one PostgreSQL for every component (a database each), as the platform compose does.
apiVersion: v1
kind: Namespace
metadata:
  name: databases
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: databases
  labels: {app.kubernetes.io/name: postgresql}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql}
    spec:
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:17-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-owner, key: password}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: databases
spec:
  selector: {app.kubernetes.io/name: postgresql}
  ports: [{name: pg, port: 5432, targetPort: pg}]
