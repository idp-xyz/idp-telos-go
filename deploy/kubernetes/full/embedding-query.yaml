# The second embedding instance, for the CMI's query embeddings (idp-cmi `embedding.query`): TEI queues per input, so on one instance a query waits behind a whole ingest
# request (measured 247 s behind 64 inputs; knowledge-base plan section 10). Same image, same Secret, same model; 2 CPUs. It carries the label component=embedding, so the
# policies of embedding.yaml (only idp-cmi in, nothing out) cover it. The CMI's `embedding.query` (idp-cmi D59) points at its Service (kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-embedding-query
  namespace: idp-embedding
  labels: {app.kubernetes.io/name: idp-embedding-query, app.kubernetes.io/component: embedding}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: idp-embedding-query}
  template:
    metadata:
      labels: {app.kubernetes.io/name: idp-embedding-query, app.kubernetes.io/component: embedding}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10700, runAsGroup: 10700, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: embedding
          image: idp-embedding
          env:
            - {name: IDP_EMBEDDING_THREADS, value: "2"}      # follows the CPU limit below
            - {name: IDP_EMBEDDING_MAX_BATCH_TOKENS, value: "1024"}   # questions only: warm-up 14 s, peak 2.6 GiB (measured); a longer text is refused and answered from words alone
            - {name: IDP_EMBEDDING_MAX_CLIENT_BATCH, value: "8"}
          ports:
            - {name: api, containerPort: 8700}
            - {name: metrics, containerPort: 9700}
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: {cpu: "1", memory: 2560Mi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: key, mountPath: /run/secrets/embedding, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: key, secret: {secretName: idp-embedding-key}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: idp-embedding-query
  namespace: idp-embedding
spec:
  selector: {app.kubernetes.io/name: idp-embedding-query}
  ports: [{name: api, port: 8700, targetPort: api}]
