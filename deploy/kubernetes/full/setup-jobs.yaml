# full overlay: the service login of each component (ensure-login) and the one tenant (seed-tenant), which must be the
# tenant_id Keycloak puts into every token (ConfigMap platform-tenant, created per run by tests/kind/full.sh).
# Applied by tests/kind/full.sh after the migration Jobs have completed (label idp-telos/phase: setup).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kind-login
  namespace: idp-cmi
  labels: {app.kubernetes.io/component: kind-setup, idp-telos/phase: setup}
spec:
  backoffLimit: 12
  template:
    metadata:
      labels: {app.kubernetes.io/component: migrate}   # the migrate NetworkPolicy lets it reach PostgreSQL
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: login
          image: idp-cmi
          command: ["/usr/local/bin/idp-cmi", "ensure-login", "idp_cmi_svc"]
          env:
            - name: IDP_MIGRATION_DATABASE_URL
              valueFrom: {secretKeyRef: {name: idp-cmi-db, key: owner-url}}
            - name: IDP_APP_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: idp-cmi-db, key: app-password}}
          resources: {limits: {cpu: 200m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
