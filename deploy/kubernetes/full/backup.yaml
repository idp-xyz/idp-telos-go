# Backups of the platform's PostgreSQL (full overlay, DEV ONLY): a CronJob dumps every database (pg_dump -Fc) and the
# cluster's roles (pg_dumpall --globals-only) into a second volume, with a manifest of sha256 sums, and keeps the last
# seven. The dumps are NOT encrypted and live on the same node as the database: this proves the mechanism and the
# restore (tests/kind/backup-drill.sh), it is not a disaster-recovery setup (that needs another failure domain,
# encryption and an alert on a missed run).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: databases
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: databases
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: pg-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: backup
              image: public.ecr.aws/docker/library/postgres:17-alpine
              command: [sh, -ec]
              args:
                - |
                  export PGHOST=postgresql PGUSER=postgres
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"; D="/backup/$TS"; mkdir -p "$D.partial"
                  pg_dumpall --globals-only > "$D.partial/globals.sql"
                  for db in $(psql -d postgres -tAc "SELECT datname FROM pg_database WHERE datistemplate = false AND datname <> 'postgres' ORDER BY 1"); do
                    pg_dump -Fc -d "$db" -f "$D.partial/$db.dump"
                    pg_restore -l "$D.partial/$db.dump" >/dev/null   # the dump must be readable, or the backup failed
                  done
                  (cd "$D.partial" && sha256sum * > MANIFEST.sha256)
                  mv "$D.partial" "$D"
                  ls -1dt /backup/2* | tail -n +8 | xargs -r rm -rf   # keep the last seven
                  echo "backup $TS:"; ls -l "$D"
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: postgres-owner, key: password}}
              resources: {limits: {cpu: "1", memory: 512Mi}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: backups, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: backups, persistentVolumeClaim: {claimName: postgres-backups}}
            - {name: tmp, emptyDir: {}}
---
# the backup Pods reach PostgreSQL (same namespace); everything else stays default-deny
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-backup
  namespace: databases
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: pg-backup}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-from-backup
  namespace: databases
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: pg-backup}}
      ports: [{protocol: TCP, port: 5432}]
