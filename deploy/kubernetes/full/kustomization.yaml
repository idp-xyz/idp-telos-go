# The WHOLE platform (the paths of tests/kind/full.sh) on a kind cluster from the components' own manifests: idp-cmi, idp-host,
# idp-workspace, idp-eer, idp-mcp, idp-sandbox, idp-web and idp-mcp-bridge, plus PostgreSQL, Keycloak (OIDC, https issuer) and Temporal in
# the cluster, the HOST's model double, setup Jobs and the NetworkPolicies the integrations need
# (networkpolicy.yaml; every namespace stays default-deny). Everything cluster-specific is a patch here.
# The sandbox comes with its egress proxy (idp-sandbox/deploy/kubernetes-egress, idp-sandbox ADR-0001 D22): a run may ask
# for network=egress and then reaches the hosts on its tenant's allow-list through the proxy, and nothing else. The
# list is the sandbox's as shipped, which allows nothing.
# idp-web (the agents' web search and page reading, platform ADR-0003) is included as shipped: no tenant enabled, no search provider,
# an egress rule that excludes every private address. What its acceptance (PATH M and N) needs is NOT here but in the overlay that
# tests/kind/full.sh renders per run: the fixture provider, the tenants file that enables the run's tenant, the two test origins
# and the one test NetworkPolicy that lets idp-web reach them (tests/kind/web-origin.yaml). Here: the gateway's host name at the
# registry, and the HOST's rules for the web tools.
# idp-mcp-bridge (plan idp-mcp-bridge-oauth-plan.md: third-party MCP servers, each member with their own OAuth authorization) is included as
# shipped (its namespace, Deployment, migration Job, NetworkPolicies) plus what this platform's Keycloak, Workspace and gateway need of it: the
# settings of its OAuth side, its Keycloak and database flows (networkpolicy.yaml), its login Job (setup-jobs.yaml), the gateway's and the
# registry's address list and the Workspace's connections target. What its acceptance (PATH O) needs is NOT here but in the overlay that
# tests/kind/full.sh renders per run: the connections file (the test third party's addresses), IDP_BRIDGE_TEST_ORIGINS, and the test third party
# with the one test NetworkPolicy that lets the bridge reach it (tests/kind/thirdparty.yaml).
# Secrets (the key the sandbox and its proxy share among them) and the per-run configuration (idp-eer's identity
# ConfigMap, the allow-list of the run's tenant) are NOT in this overlay: tests/kind/full.sh generates them.
# tests/kind/full.sh drives it. DEV ONLY (a test realm and CA, plain http inside the cluster).
# deploy/kubernetes/kind (the lightweight overlay with development tokens) is separate and unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infra.yaml
  - backup.yaml
  - ../../../idp-cmi/deploy/kubernetes
  - ../../../idp-host/deploy/kubernetes
  - ../../../idp-workspace/deploy/kubernetes
  - ../../../idp-eer/deploy/kubernetes
  - ../../../idp-mcp/deploy/kubernetes
  - ../../../idp-sandbox/deploy/kubernetes-egress   # deploy/kubernetes plus the egress proxy
  - ../../../idp-web/deploy/kubernetes
  - ../../../idp-mcp-bridge/deploy/kubernetes
  - ../../../idp-browser/deploy/kubernetes
  - fakemodel.yaml
  - assistant.yaml
  - setup-jobs.yaml
  - networkpolicy.yaml
images:
  - {name: registry.example.com/idp/idp-cmi, newName: idp-cmi, newTag: dev}
  - {name: registry.example.com/idp/idp-host, newName: idp-host, newTag: dev}
  - {name: registry.example.com/idp/idp-workspace, newName: idp-workspace, newTag: dev}
  - {name: registry.example.com/idp/eer-runtime, newName: eer-runtime, newTag: dev}
  - {name: registry.example.com/idp/idp-mcp, newName: idp-mcp, newTag: dev}
  - {name: registry.example.com/idp/idp-sandbox, newName: idp-sandbox, newTag: dev}
  - {name: registry.example.com/idp/idp-sandbox-egress, newName: idp-sandbox-egress, newTag: dev}
  - {name: registry.example.com/idp/idp-web, newName: idp-web, newTag: dev}
  - {name: registry.example.com/idp/idp-mcp-bridge, newName: idp-mcp-bridge, newTag: dev}
  - {name: registry.example.com/idp/idp-browser, newName: idp-browser, newTag: dev}
  - {name: registry.example.com/idp/idp-browser-proxy, newName: idp-browser-proxy, newTag: dev}
  - {name: idp-cmi, newTag: dev}         # the setup Jobs name the images directly
  - {name: idp-host, newTag: dev}
  - {name: idp-workspace, newTag: dev}
  - {name: idp-mcp, newTag: dev}
  - {name: idp-web, newTag: dev}
  - {name: idp-mcp-bridge, newTag: dev}
patches:
  # ================= idp-cmi: Keycloak tokens (keys over http inside the cluster), plain http, no model endpoints =================
  - target: {kind: ConfigMap, name: idp-cmi-env}
    patch: |-
      - op: replace
        path: /data
        value:
          IDP_CMI_LISTEN: "0.0.0.0:8550"
          IDP_CMI_CONFIG: "/etc/idp/config/cmi.yaml"
          IDP_DEV_MODE: "false"
          IDP_CMI_ISSUER: "https://127.0.0.1:17443/realms/idp"
          IDP_CMI_AUDIENCE: "idp-cmi"
          IDP_CMI_JWKS_URL: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/certs"
          IDP_CMI_ALLOW_INSECURE_JWKS: "true"   # DEV: Keycloak over plain http in the cluster; production serves the keys over https (idp-cmi D42)
          IDP_LOG_LEVEL: "info"
          IDP_METRICS_LISTEN: "0.0.0.0:9565"
          # the knowledge originals (idp-cmi D47 to D58): a RustFS of its own on the host's side of the cluster network (tests/kind/s3-target.sh, port 19510; the
          # address is the one full.sh puts in for 203.0.113.40), the keys from the Secret idp-cmi-originals mounted below
          IDP_CMI_ORIGINALS_ENDPOINT: "http://203.0.113.40:19510"
          IDP_CMI_ORIGINALS_BUCKET: "knowledge-originals"
          IDP_CMI_ORIGINALS_ACCESS_KEY_FILE: "/etc/idp/originals/access"
          IDP_CMI_ORIGINALS_SECRET_KEY_FILE: "/etc/idp/originals/secret"
  - target: {kind: ConfigMap, name: idp-cmi-config}
    patch: |-
      - op: replace
        path: /data
        value: {cmi.yaml: ""}
  - target: {kind: Deployment, name: idp-cmi}
    patch: &http-probes |-
      - {op: replace, path: /spec/template/spec/containers/0/readinessProbe/httpGet/scheme, value: HTTP}
      - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/httpGet/scheme, value: HTTP}
  - target: {kind: Deployment, name: idp-cmi}
    patch: |-
      # added, never replaced: idp-cmi's own emptyDir "scratch" (/var/cache/idp-cmi, 512Mi, IDP_CMI_TEMP_DIR) must survive for the downloads of originals
      - {op: add, path: /spec/template/spec/containers/0/volumeMounts/-, value: {name: originals, mountPath: /etc/idp/originals, readOnly: true}}
      - {op: add, path: /spec/template/spec/volumes/-, value: {name: originals, secret: {secretName: idp-cmi-originals}}}
  # ================= idp-host: Keycloak tokens, the model double, context from the CMI, delegation to the idp-mcp gateway =================
  - target: {kind: ConfigMap, name: idp-host-env}
    patch: |-
      - op: replace
        path: /data
        value:
          IDP_HOST_LISTEN: "0.0.0.0:8450"
          IDP_HOST_CONFIG: "/etc/idp/config/host.yaml"
          IDP_HOST_WORKERS: "2"
          IDP_HOST_LEASE: "30s"
          IDP_DEV_MODE: "true"        # only so the HOST talks plain http to its model double and the gateway (as in compose); tokens are Keycloak's
          IDP_HOST_ISSUER: "https://127.0.0.1:17443/realms/idp"
          IDP_HOST_AUDIENCE: "idp-host"
          IDP_HOST_JWKS_URL: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/certs"
          IDP_HOST_CREDENTIAL_KEY_FILE: "/etc/idp/credential-key/key"
          IDP_LOG_LEVEL: "info"
          IDP_METRICS_LISTEN: "0.0.0.0:9465"
  - target: {kind: ConfigMap, name: idp-host-providers}
    patch: |-
      - op: replace
        path: /data
        value:
          host.yaml: |
            providers:
              - name: local
                kind: openai
                baseUrl: http://fakemodel.idp-host.svc.cluster.local:18080/v1
                insecure: true
                # the model double is this platform's own (as in compose, deploy/compose/e2e.sh): without `external: false` a provider counts as
                # outside the enterprise (idp-host D43, D44) and every run, web tools or not, is withheld the context items above the ceiling,
                # which is what PATH N (d) tells apart from the run that has web tools
                external: false
            cmi:
              endpoint: http://idp-cmi.idp-cmi.svc.cluster.local:8550
              # reads AS THE MEMBER (RFC 8693 exchange for the CMI audience), so a member's own memories are the ones retrieved
              auth:
                mode: delegation
                tokenEndpoint: http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token
                clientId: idp-host
                clientSecretFile: /etc/idp/gateway-client/client-secret
                audience: idp-cmi
              # writes the conversation memory with its own identity (idp-host-svc: cmi-writer; a client-credentials token, one hour)
              remember:
                enabled: true
                source: idp-host
                ttlDays: 30
                # the HOST mints and refreshes its own token for the CMI (idp-host D36); a token put here at
                # deployment time would stop working when it expired, and memory would go silently unwritten
                auth: {mode: client_credentials, tokenEndpoint: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token", clientId: idp-host-svc, clientSecretFile: /etc/idp/provider-keys/cmi-client-secret, audience: idp-cmi}
                # the turn and the facts the user stated (idp-host D34); the extraction model is the same provider as the agents'
                # (with MODEL=live, tests/kind/full.sh puts the live model's name here as well: a real model extracts the facts)
                mode: both
                facts: {provider: local, model: fake-1}
            gateways:
              - name: edge
                endpoint: http://idp-mcp-gateway-edge-1.idp-mcp.svc.cluster.local:3220/mcp
                auth:
                  mode: delegation
                  tokenEndpoint: http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token
                  clientId: idp-host
                  clientSecretFile: /etc/idp/gateway-client/client-secret
                  audience: http://idp-mcp-gateway-edge-1.idp-mcp.svc.cluster.local:3220/mcp
                  actorToken: true
                # the HOST's own rules for the web tools, whatever a release says (idp-host D44): they send content outside the
                # enterprise, so a run that may use them is not given context items above the ceiling; and the member confirms a
                # page address of their own
                externalTools: ["web__*"]
                confirmTools: ["web__web_open_url"]
  - target: {kind: Deployment, name: idp-host}
    patch: *http-probes
  # ================= idp-workspace: Keycloak tokens, token exchange to the HOST and idp-eer =================
  - target: {kind: ConfigMap, name: idp-workspace-env}
    patch: |-
      - op: replace
        path: /data
        value:
          IDP_WORKSPACE_LISTEN: "0.0.0.0:8560"
          IDP_WORKSPACE_CONFIG: "/etc/idp/config/workspace.yaml"
          IDP_WORKSPACE_ISSUER: "https://127.0.0.1:17443/realms/idp"
          IDP_WORKSPACE_AUDIENCE: "idp-workspace"
          IDP_WORKSPACE_JWKS_URL: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/certs"
          IDP_WORKSPACE_SUBJECT_CLAIM: "preferred_username"
          IDP_WORKSPACE_OIDC_CLIENT_ID: "workspace-shell"
          IDP_WORKSPACE_PUBLIC_URL: "http://127.0.0.1:17560"
          IDP_WORKSPACE_SIGNING_KEY_FILE: "/etc/idp/signing/signing.pem"
          IDP_LOG_LEVEL: "info"
          IDP_METRICS_LISTEN: "0.0.0.0:9566"
  - target: {kind: ConfigMap, name: idp-workspace-config}
    patch: |-
      - op: replace
        path: /data
        value:
          workspace.yaml: |
            targets:
              host:
                endpoint: "http://idp-host.idp-host.svc.cluster.local:8450"
                auth: exchange
                exchange: {tokenUrl: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token", clientId: idp-workspace, clientSecretFile: /etc/idp/exchange/client-secret, audience: idp-host}
              eer:
                endpoint: "http://eer-api.idp-eer.svc.cluster.local:8080"
                auth: exchange
                exchange: {tokenUrl: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token", clientId: idp-workspace, clientSecretFile: /etc/idp/exchange/client-secret, audience: eer-runtime}
                tenantId: pilot
              cmi:
                endpoint: "http://idp-cmi.idp-cmi.svc.cluster.local:8550"
                auth: exchange
                exchange: {tokenUrl: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token", clientId: idp-workspace, clientSecretFile: /etc/idp/exchange/client-secret, audience: idp-cmi}
              # connected services (idp-workspace D30): the bridge's internal API (8681); the member's token exchanged for the bridge's audience, which is
              # IDP_BRIDGE_API_AUDIENCE; publicUrl is the Workspace as the member's browser has it (the port-forward). TESTS ONLY: it is plain http, and so is
              # the test third party's authorization page: testOrigins names those two exactly
              connections:
                endpoint: "http://idp-mcp-bridge.idp-mcp-bridge.svc.cluster.local:8681"
                auth: exchange
                exchange: {tokenUrl: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token", clientId: idp-workspace, clientSecretFile: /etc/idp/exchange/client-secret, audience: idp-mcp-bridge}
                publicUrl: "http://127.0.0.1:17560"
                testOrigins: ["127.0.0.1:17560", "thirdparty.thirdparty.svc.cluster.local:8590"]
            webhooks:
              secretFile: /etc/idp/webhook/secret
  - target: {kind: Deployment, name: idp-workspace}
    patch: *http-probes
  # ================= idp-eer: Keycloak (https key URL, the run's CA), Temporal, the Workspace inbox =================
  - target: {kind: ConfigMap, name: eer-env}
    patch: |-
      - {op: replace, path: /data/EER_EXECUTION_INVOKER_MODE, value: "conformance"}   # EER's deterministic Actor harness; no real connectors in the platform
      - {op: remove, path: /data/OTEL_EXPORTER_OTLP_ENDPOINT}
  # eer-identity (issuers, principal mappings, authorization policy) holds the per-run user ids: tests/kind/full.sh creates it
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: eer-identity
        namespace: idp-eer
  - target: {kind: ConfigMap, name: eer-workspace-inbox}
    patch: |-
      - op: replace
        path: /data
        value:
          EER_WORKSPACE_INBOX_URL: "http://idp-workspace.idp-workspace.svc.cluster.local:8560"
          EER_WORKSPACE_INBOX_WORKSPACE: "us-ops"
          EER_WORKSPACE_INBOX_APP: "eer-approvals"
          EER_WORKSPACE_INBOX_ROLES: "approver"
          EER_WORKSPACE_INBOX_TOKEN_URL: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/token"
          EER_WORKSPACE_INBOX_CLIENT_ID: "svc-eer"
          EER_WORKSPACE_INBOX_CLIENT_SECRET_FILE: "/etc/eer/workspace-inbox/client-secret"
  - target: {kind: Deployment, name: eer-api}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: SSL_CERT_FILE, value: /etc/eer/ca/ca.crt}}   # EER fetches keys over https only
      - {op: add, path: /spec/template/spec/containers/0/volumeMounts, value: [{name: identity-ca, mountPath: /etc/eer/ca, readOnly: true}]}
      - {op: add, path: /spec/template/spec/volumes, value: [{name: identity-ca, secret: {secretName: eer-identity-ca}}]}
  # ================= idp-mcp: dev admin tokens at the registry, the gateway in jwt mode; plain http inside the cluster =================
  - target: {kind: ConfigMap, name: idp-mcp-registry}
    patch: |-
      - op: replace
        path: /data
        value:
          IDP_REGISTRY_LISTEN: "0.0.0.0:8250"
          IDP_DEV_MODE: "true"          # HS256 admin tokens (registry-service dev-token); the data plane verifies Keycloak tokens
          IDP_ALLOWED_UPSTREAM_HOSTS: "idp-sandbox.idp-sandbox.svc.cluster.local,idp-web.idp-web.svc.cluster.local,idp-mcp-bridge.idp-mcp-bridge.svc.cluster.local"
          IDP_PRIVATE_UPSTREAM_HOSTS: "idp-sandbox.idp-sandbox.svc.cluster.local,idp-web.idp-web.svc.cluster.local,idp-mcp-bridge.idp-mcp-bridge.svc.cluster.local"
          # a server registered at the bridge's address must be of class external (idp-mcp ADR-0001 D50); the gateway holds the same list
          IDP_BRIDGE_ENDPOINTS: "http://idp-mcp-bridge.idp-mcp-bridge.svc.cluster.local:8680/mcp/"
          IDP_DEPLOY_TIMEOUT: "60s"
          IDP_LOG_LEVEL: "info"
  - target: {kind: Deployment, name: idp-mcp-registry}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: replace, path: /spec/template/spec/containers/0/readinessProbe/httpGet/scheme, value: HTTP}
      - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/httpGet/scheme, value: HTTP}
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: IDP_DEV_ADMIN_SECRET, valueFrom: {secretKeyRef: {name: idp-mcp-admin, key: secret}}}}
      - {op: replace, path: /spec/template/spec/containers/0/volumeMounts, value: []}
      - {op: replace, path: /spec/template/spec/volumes, value: []}
  - target: {kind: ConfigMap, name: idp-mcp-gateway-edge-1}
    patch: |-
      - op: replace
        path: /data
        value:
          IDP_GATEWAY_LISTEN: "0.0.0.0:3220"
          IDP_REGISTRY_URL: "http://idp-mcp-registry.idp-mcp.svc.cluster.local:8250"
          IDP_GATEWAY_TOKEN_FILE: "/etc/idp/credential/token"
          IDP_GATEWAY_CALLER_KEY_FILE: "/etc/idp/caller/caller.key"   # signs the caller it forwards (idp-mcp D44); the sandbox and idp-web require it
          IDP_GATEWAY_CLIENTS_FILE: "/etc/idp/clients/clients.yaml"   # the OAuth clients served; the gateway does not start without it (idp-mcp D46)
          # the bridge's address: a target there is external and receives the signed caller assertion (the caller key above; without it a call to
          # the bridge is not delivered) and nothing else of the caller (idp-mcp ADR-0001 15.1)
          IDP_BRIDGE_ENDPOINTS: "http://idp-mcp-bridge.idp-mcp-bridge.svc.cluster.local:8680/mcp/"
          IDP_GATEWAY_ALLOWED_HOSTS: "idp-mcp-gateway-edge-1.idp-mcp.svc.cluster.local,idp-mcp-gateway-edge-1.idp-mcp.svc.cluster.local:3220"
          IDP_RELEASE_CACHE: "/var/cache/idp/release.json"
          IDP_CALL_TIMEOUT: "60s"
          IDP_DRIFT_INTERVAL: "60s"
          IDP_LOG_LEVEL: "info"
  # the clients the gateway serves (idp-mcp ADR-0001 D46 to D49): idp-host is the HOST, the only client that may call the web tools
  # (they carry the controls that live in the HOST); idp-probe is the acceptance's platform client that is not the HOST (PATH M2;
  # deploy/keycloak/realm.py). Platform clients are not rate limited unless they say so. Needs idp-mcp's manifests with the
  # idp-mcp-gateway-edge-1-clients ConfigMap (idp-mcp ADR-0001 section 14).
  - target: {kind: ConfigMap, name: idp-mcp-gateway-edge-1-clients}
    patch: |-
      - op: replace
        path: /data
        value:
          clients.yaml: |
            clients:
              idp-host: {kind: platform, host: true}
              idp-probe: {kind: platform}
            hostOnlyTools: ["web__*", "thirdparty__*"]
  - target: {kind: Deployment, name: idp-mcp-gateway-edge-1}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: replace, path: /spec/template/spec/containers/0/readinessProbe/httpGet/scheme, value: HTTP}
      - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/httpGet/scheme, value: HTTP}
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: credential, mountPath: /etc/idp/credential, readOnly: true}, {name: caller-key, mountPath: /etc/idp/caller, readOnly: true}, {name: clients, mountPath: /etc/idp/clients, readOnly: true}, {name: cache, mountPath: /var/cache/idp}]
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - {name: credential, secret: {secretName: idp-mcp-gateway-edge-1, items: [{key: token, path: token}]}}
          - {name: caller-key, secret: {secretName: idp-mcp-gateway-caller-key}}   # created per run by tests/kind/full.sh
          - {name: clients, configMap: {name: idp-mcp-gateway-edge-1-clients}}
          - {name: cache, emptyDir: {sizeLimit: 64Mi}}
  # ================= idp-sandbox: callers must be signed by the gateway (idp-sandbox ADR-0001 D18) =================
  # The public key(s) are a ConfigMap full.sh creates per run (a rotation adds a second key to the same file); the audience is
  # the endpoint the gateway has registered (full.sh: SANDBOX_URL). The shipped manifest has both lines commented out.
  - target: {kind: Deployment, name: idp-sandbox, namespace: idp-sandbox}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: IDP_SANDBOX_CALLER_KEYS_FILE, value: /etc/idp/gateway/caller.pub}}
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: IDP_SANDBOX_CALLER_AUDIENCE, value: "http://idp-sandbox.idp-sandbox.svc.cluster.local:8570/mcp"}}
      - {op: add, path: /spec/template/spec/containers/0/volumeMounts/-, value: {name: gateway-caller-keys, mountPath: /etc/idp/gateway, readOnly: true}}
      - {op: add, path: /spec/template/spec/volumes/-, value: {name: gateway-caller-keys, configMap: {name: idp-sandbox-gateway-caller-keys}}}
  # ================= idp-mcp-bridge: Keycloak's keys over plain http inside the cluster, the Workspace's redirect address =================
  # The OAuth side's settings are the operator's own (the shipped Deployment says so): the Workspace's callback page, Keycloak's realm, the bridge's
  # audience and the one client whose token is accepted, and the realm role of the operators who authorize reviewer accounts. The secrets and files
  # it mounts (the gateway's public key, the connections file, the database URLs, the sealing keys, a preregistered client's secret) are created by
  # tests/kind/full.sh; IDP_BRIDGE_TEST_ORIGINS and the connections are in its per-run overlay.
  - target: {kind: Deployment, name: idp-mcp-bridge, namespace: idp-mcp-bridge}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: IDP_BRIDGE_REDIRECT_URI, value: "http://127.0.0.1:17560/oauth/callback"}}
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: IDP_BRIDGE_OIDC_ISSUER, value: "https://127.0.0.1:17443/realms/idp"}}
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: IDP_BRIDGE_OIDC_JWKS_URL, value: "http://keycloak.keycloak.svc.cluster.local:7080/realms/idp/protocol/openid-connect/certs"}}
