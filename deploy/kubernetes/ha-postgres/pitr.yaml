# Continuous archiving and point-in-time recovery for the HA cluster (tests/kind/pitr-drill.sh demonstrates it): every instance's WAL
# goes to the object store as soon as a segment is full (or archive_timeout passes), a base backup is taken every night, and the
# cluster can be recreated at any moment between the oldest base backup and the last archived segment. This bounds the loss of a
# disaster that replication cannot cover (a mistaken DELETE, a dropped table, a corrupted write that replicated): RPO is
# archive_timeout, not the age of the nightly dump.
#
# Done by the Barman Cloud plugin (barman-cloud.cloudnative-pg.io, installed next to the operator; README.md): it adds a sidecar with
# barman-cloud to every instance, which archives the WAL and takes the base backups; the PostgreSQL image carries no backup tool. Three
# documents, in this order:
#   1  the ObjectStore: where the archive lives, the credentials (the Secret pitr-s3), the retention. The endpoint is replaced by
#      tests/kind/full.sh with the RustFS on the host; production writes its own bucket (S3, GCS or Azure).
#   2  a merge patch of the Cluster: the plugin is the WAL archiver. tests/kind/full.sh merges it into cluster.yaml, so a new cluster
#      archives from its first instance; a running cluster takes it with kubectl patch cluster postgresql --type merge --patch-file.
#      "backup: null" removes CloudNativePG's in-tree barmanObjectStore in the same change, so a cluster that used it moves to the
#      plugin in one rolling update and keeps archiving to the same path (README.md, "Moving from the in-tree barman").
#   3  the ScheduledBackup, through the plugin.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgresql-backups
  namespace: databases
spec:
  retentionPolicy: 7d              # base backups and WAL older than the 7-day recovery window are deleted
  configuration:
    destinationPath: s3://backups/wal/
    endpointURL: http://203.0.113.20:19000
    s3Credentials:
      accessKeyId: {name: pitr-s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: pitr-s3, key: ACCESS_SECRET_KEY}
    wal: {compression: gzip, maxParallel: 2}
    data: {compression: gzip}
---
spec:
  backup: null                     # no in-tree barmanObjectStore (removed from CloudNativePG in 1.32)
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: postgresql-backups}
  postgresql:
    parameters:
      archive_timeout: "60"        # a quiet database still ships its tail at least every minute
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgresql-nightly
  namespace: databases
spec:
  schedule: "0 0 2 * * *"          # six fields (seconds first): 02:00 every day
  cluster: {name: postgresql}
  backupOwnerReference: self
  immediate: true                  # the first base backup right away, so recovery is possible from the start
  target: prefer-standby           # the base backup is read from a standby: the primary is not loaded
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
