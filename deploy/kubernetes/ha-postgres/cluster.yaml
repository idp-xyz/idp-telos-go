# A highly available PostgreSQL for the platform, run by CloudNativePG (operator 1.30.1, deploy/kubernetes/ha-postgres/README.md):
# one primary and two standbys with streaming replication, SYNCHRONOUS (a transaction is acknowledged only after one standby has
# it on disk: a failover loses no acknowledged write), automatic promotion when the primary fails, TLS on every connection with
# verify-full on the clients' side, and no cleartext TCP. Applications connect to the Service postgresql-rw (always the primary);
# postgresql-ro and postgresql-r are the standbys. The image carries pgvector (deploy/images/postgres-ha).
#
# Secrets in this namespace (tests/kind/full.sh and tests/kind/ha-postgres.sh create them for the test CA; production uses
# cert-manager or the enterprise CA):
#   postgres-superuser   kubernetes.io/basic-auth  username: postgres, password        (the owner role the migrations use)
#   postgres-server-ca   ca.crt                     the CA that signed the server certificate (clients trust it)
#   postgres-tls         kubernetes.io/tls          the server certificate: SAN postgresql-rw, postgresql-ro, postgresql-r (each with
#                                                   .NAMESPACE, .NAMESPACE.svc and .NAMESPACE.svc.cluster.local)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: databases
spec:
  instances: 3
  imageName: idp-postgres-ha:17-dev          # CloudNativePG operand + pgvector; pin by digest in production
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: true
  superuserSecret: {name: postgres-superuser}
  primaryUpdateStrategy: unsupervised         # a rolling update recreates the standbys first, the primary last
  primaryUpdateMethod: switchover             # ...after moving the primary role to an updated standby. The default, "restart", recreates the
                                              # primary in place: its smart shutdown refuses every new connection for up to 180 s
                                              # (smartShutdownTimeout) while the pools hold theirs open (README.md). With switchover an image
                                              # change and a parameter change cannot go in the same update: make them one after the other
  storage: {size: 5Gi}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  affinity:                                   # never two instances on one node: an instance waits rather than share a node
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  topologySpreadConstraints:                  # and one per zone. The nodes must carry topology.kubernetes.io/zone (clouds set it): a node
    - maxSkew: 1                              # without it takes no instance, so missing labels stop the cluster instead of letting it
      topologyKey: topology.kubernetes.io/zone   # start in one place, which an anti-affinity on the zone does (README.md, measured)
      whenUnsatisfiable: DoNotSchedule
      labelSelector: {matchLabels: {cnpg.io/cluster: postgresql, cnpg.io/podRole: instance}}
  certificates:
    serverCASecret: postgres-server-ca
    serverTLSSecret: postgres-tls
  postgresql:
    parameters:
      ssl_min_protocol_version: TLSv1.2
      password_encryption: scram-sha-256
      max_connections: "200"
      log_connections: "on"
      log_disconnections: "on"
    synchronous:
      method: any
      number: 1                               # one standby must have the commit before the client hears "committed"
      dataDurability: required                # with no standby the primary blocks writes rather than acknowledge one that could be lost
      failoverQuorum: true                    # promote only a standby the quorum says holds every acknowledged commit
    pg_hba:                                   # after CloudNativePG's own replication rules, before its catch-all
      - hostssl all all 0.0.0.0/0 scram-sha-256
      - hostssl all all ::/0 scram-sha-256
      - hostnossl all all all reject
  bootstrap:
    initdb:
      database: idp_bootstrap
      owner: idp_bootstrap
