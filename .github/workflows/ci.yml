name: CI

# The merge gate of the platform repository (docs/adr/ADR-0001-platform-integration.md): the
# components are checked out at the commits releases/platform-bom.yaml pins, then the catalog, BOM and
# compatibility matrix are checked (tools/platform.py check), the tool's own tests run, and the
# contract registry is validated against the producers' copies (idp-contracts/tools/validate.py).
# idp-eer is private: it is cloned with the read-only deploy key (secret IDP_EER_DEPLOY_KEY) and required
# on main; a pull request without secrets (a fork) reports its rows NOT_RUN (allowed), never passed.
# The platform acceptance (deploy/compose/e2e.sh) runs in platform.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: catalog, BOM, compatibility, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Pinned tools
        run: pip install --disable-pip-version-check 'jsonschema[format]==4.26.0' 'PyYAML==6.0.3'
      - name: Components at the BOM's commits
        env:
          IDP_EER_DEPLOY_KEY: ${{ secrets.IDP_EER_DEPLOY_KEY }}
        run: python -I tools/checkout_components.py ${{ github.event_name == 'push' && '--require idp-eer' || '' }}
      - name: idp-eer checked out?
        id: eer
        run: echo "allow=$([ -d idp-eer/.git ] || echo '--allow-missing idp-eer')" >> "$GITHUB_OUTPUT"
      - name: Catalog, BOM and compatibility matrix
        run: python -I tools/platform.py check ${{ steps.eer.outputs.allow }}
      - name: Platform tool tests
        run: python -m unittest discover -s tools/tests -v
      - name: Kubernetes manifests as one platform (NetworkPolicies of every integration)
        run: python -I tools/k8s_check.py ${{ steps.eer.outputs.allow }}
      - name: Contract registry against the producers
        run: python -I idp-contracts/tools/validate.py --report /tmp/validation_report.json
