name: kind

# The platform on a real Kubernetes cluster (docs/adr/ADR-0001-platform-integration.md P3): the
# public components are cloned at the BOM's commits and built, their own manifests are composed by
# deploy/kubernetes/kind and applied to kind, and tests/kind/smoke.sh runs PATH A through the cluster.

# Not on every push (tests/ACCEPTANCE.md): the platform on kind answers whether the manifests, the network policies, the sandbox runtime and the kind scripts work together; the compose
# acceptance (platform.yml) answers everything else. It runs when those change, every night (which also catches what arrives through a component's own manifests with a BOM bump) and by hand.
# tests/kind/full.sh (the full script, with gVisor and EMBED=double) is run on a machine of ours, before a BOM that touched them; this workflow runs tests/kind/smoke.sh (PATH A).
on:
  push:
    branches: [main]
    paths:
      - deploy/kubernetes/**              # the manifests, and with them the NetworkPolicies (deploy/kubernetes/full/networkpolicy.yaml)
      - tests/kind/**                     # the kind scripts, the gVisor node (tests/kind/gvisor-node.sh: the sandbox runtime)
      - deploy/keycloak/**
      - deploy/images/embedding-double/** # the double that kind runs in place of the two embedding pods
      - tools/k8s_check.py                # the check of the policies
      - tools/acceptance.py
      - tests/paths.yaml
      - deploy/compose/lib_acceptance.sh
      - .github/workflows/kind.yml
  pull_request:
    paths:
      - deploy/kubernetes/**              # the manifests, and with them the NetworkPolicies (deploy/kubernetes/full/networkpolicy.yaml)
      - tests/kind/**                     # the kind scripts, the gVisor node (tests/kind/gvisor-node.sh: the sandbox runtime)
      - deploy/keycloak/**
      - deploy/images/embedding-double/** # the double that kind runs in place of the two embedding pods
      - tools/k8s_check.py                # the check of the policies
      - tools/acceptance.py
      - tests/paths.yaml
      - deploy/compose/lib_acceptance.sh
      - .github/workflows/kind.yml
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    name: platform on kind
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned tools
        run: pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Components at the BOM's commits (public repositories)
        run: python -I tools/checkout_components.py idp-cmi idp-host idp-workspace
      - uses: helm/kind-action@v1
        with:
          cluster_name: idp-telos
      - name: Platform on kind, PATH A
        run: bash tests/kind/smoke.sh
      - name: Cluster state on failure
        if: failure()
        run: kubectl get pods -A -o wide; kubectl get events -A --sort-by=.lastTimestamp | tail -60
