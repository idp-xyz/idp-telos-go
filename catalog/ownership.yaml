# State authority (repository engineering architecture §03, "One Source of Truth"): every kind of
# data has exactly one authoritative component; the others may show, reference or cache it but never
# become a second fact. Checked by tools/platform.py check (exactly one owner per kind).
ownership:
  - data: Workspace, membership, app installation, inbox item (as a view), work context, action invocation record
    owner: idp-workspace
    not: approval record, run state, business transactions
  - data: AgentDefinition / release, AgentRun, Session, thread, tool-call confirmation
    owner: idp-host
    not: the business Execution
  - data: Goal, Task, Plan, Execution, Checkpoint, Retry, Approval, Evidence
    owner: idp-eer
    not: CMI memory (checkpoints are never written to CMI)
  - data: ContextPackage, MemoryRecord, KnowledgeDocument, Source, erasure
    owner: idp-cmi
    not: the real-time business fact
  - data: MCP server / tool registry, connection policy, invocation audit
    owner: idp-mcp
    not: business APIs' contracts
  - data: Sandbox workspace (the ephemeral files an agent's code leaves, in memory, deleted with the workspace)
    owner: idp-sandbox
    not: anything that must outlive a run (results go to the caller, durable data to its owner)
  - data: Web tool audit line (the query and the address in clear, the caller as a short hash, the decision and its reason)
    owner: idp-web
    not: the gateway's invocation record (idp-mcp keeps arguments as a digest only), search results and page text (never stored; the read cache is in memory)
  - data: Web tool daily quota counts (per tenant, UTC day and kind) and the numbers [n] of the sources a caller was shown (hashes of the caller and of the address)
    owner: idp-web
    not: the query, the address, the page, the caller's subject (never stored there), and the audit (a log line)
  - data: A member's grants for third-party services (the access and refresh tokens, sealed, per tenant, member and connection), the reviewer account's grant of a connection, the authorizations under way (state as its SHA-256, sealed PKCE verifier) and the clients registered dynamically
    owner: idp-mcp-bridge
    not: "the Workspace's record of who started a connection (connection_pending, hashes of state, never a token or a code), the gateway's invocation record, and every identity and credential of the platform (a third party is never given one)"
  - data: Contract registry, platform BOM, compatibility matrix
    owner: idp-telos-go
    not: any component's source or state
