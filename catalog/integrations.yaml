# Cross-system calls the system architecture allows (ADR-0001 T2), each with how it authenticates
# and what proves it. "contract": the registered namespace the call's documents follow, or null when
# the interface is the callee's own API without a registered contract (a finding, not a pass).
# "port": the callee port; tools/k8s_check.py checks that the rendered NetworkPolicies of both ends
# allow the call.
integrations:
  - id: workspace-host-run
    port: 8450   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-workspace
    to: idp-host
    interface: POST /v1/agents/{ref}/runs, GET /v1/runs/{id}/events (AG-UI)
    contract: idp.telos.host
    auth: [forward, static, exchange (RFC 8693)]
    evidence: [idp-workspace ADR-0001 §7 D12 (HOST=1 e2e), §10 D16 (OIDC=1 e2e), this repository deploy/compose/e2e.sh (PATH A)]
  - id: workspace-eer-decision
    port: 8080   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-workspace
    to: idp-eer
    interface: POST /v1/executions/{id}/approval
    contract: null
    auth: [forward, static, exchange]
    evidence: [idp-workspace internal/dispatch tests, this repository deploy/compose/e2e.sh (PATH B: a member's exchanged token decides a real T2 execution)]
  - id: eer-workspace-inbox
    port: 8560   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-eer
    to: idp-workspace
    interface: POST /v1/workspaces/{ws}/inbox/items, /inbox/close (producer)
    contract: idp.telos.workspace
    auth: [client credentials, static token file]
    evidence: [idp-eer ADR-038 (TestLiveWorkspace against the idp-workspace image), this repository deploy/compose/e2e.sh (PATH B)]
  - id: host-cmi-context
    port: 8550   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-host
    to: idp-cmi
    interface: POST /v1/context/resolve, POST /v1/context/packages/{id}/verify
    contract: idp.telos.cmi
    auth: [static, delegation]
    evidence: [idp-host ADR-0001 §14 D32, idp-cmi deploy/e2e.sh HOST=1, this repository deploy/compose/e2e.sh (PATH A)]
  - id: host-mcp-tools
    port: 3220   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-host
    to: idp-mcp
    interface: MCP (streamable HTTP) through mcp-gateway
    contract: null  # the MCP protocol itself; idp.telos.mcp describes the registry's documents, which HOST does not read
    auth: [delegation (RFC 8693, Keycloak)]
    evidence: [idp-host deploy/e2e.sh MODE=oidc, this repository deploy/compose/e2e.sh (PATH D: the HOST's exchanged token for bob is accepted by the gateway in jwt mode)]
  - id: eer-host-agent-turn
    port: 8450   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    kubernetes: not-deployed   # made by EER's Python Intelligence worker, which deploy/kubernetes of idp-eer does not run yet
    from: idp-eer
    to: idp-host
    interface: POST /v1/agents/{ref}/runs (Agent Turn)
    contract: idp.telos.host
    auth: [client credentials (workload identity)]
    evidence: [idp-eer ADR-036, make intelligence-host-integration]
  - id: eer-cmi-context
    port: 8550   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    kubernetes: not-deployed   # made by EER's Python Intelligence worker, which deploy/kubernetes of idp-eer does not run yet
    from: idp-eer
    to: idp-cmi
    interface: POST /v1/context/resolve, /verify, POST /v1/memory/records
    contract: idp.telos.cmi
    auth: [static, client credentials]
    evidence: [idp-eer ADR-037, CI cmi.yml]
  - id: mcp-sandbox-tools
    port: 8570   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-mcp
    to: idp-sandbox
    interface: MCP (streamable HTTP) upstream of mcp-gateway; tools sandbox_create / _run / _write_file / _read_file / _list_files / _delete
    contract: null  # the MCP protocol itself
    auth: [none on the hop: a private network that only the gateway reaches; the gateway authenticates and authorizes the caller and forwards it (identity=forward, idp-mcp ADR-0001 D40)]
    evidence: [idp-sandbox deploy/e2e.sh (the real gateway and registry: discovery, review, grants by role, argument validation, per-caller isolation, forgery stripped), this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH D; PATH L: a run's egress allow-list is that of the tenant the gateway forwards), idp-sandbox ADR-0001]
  - id: mcp-web-tools
    port: 8580   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-mcp
    to: idp-web
    interface: MCP (streamable HTTP) upstream of mcp-gateway; tools web_search / web_fetch / web_open_url
    contract: null  # the MCP protocol itself
    auth: [none on the hop: a private network that only the gateway reaches; the gateway authenticates and authorizes the caller and forwards it, signed, and idp-web accepts only that signature (identity=forward, idp-mcp ADR-0001 D40, D44)]
    evidence: [idp-web ADR-0001 (D2, D16 to D24), this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH M: bob's search and read through the HOST, an unsigned caller refused; PATH N: a page's instruction cannot make idp-web read an address no search listed, and web_open_url waits for the member), platform ADR-0003]
  - id: workspace-cmi-memory
    port: 8550   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-workspace
    to: idp-cmi
    interface: GET /v1/memory/records, POST /v1/memory/revoke (a member's own memory, with the member's token exchanged for the CMI audience)
    contract: idp.telos.cmi
    auth: [exchange (RFC 8693)]
    evidence: [idp-workspace ADR-0001 D21 (TestMyMemory), idp-cmi ADR-0001 D26, this repository deploy/compose/e2e.sh (PATH F)]
  - id: mcp-bridge-tools
    port: 8680   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-mcp
    to: idp-mcp-bridge
    interface: MCP (streamable HTTP) upstream of mcp-gateway, one endpoint per connection (/mcp/<id>, class external); the registry discovers its tools with tools/list; the tools are the third party's
    contract: null  # the MCP protocol itself
    auth: [the gateway's signed caller assertion, made for the connection's endpoint (idp-mcp ADR-0001 15.1, IDP_GATEWAY_CALLER_KEY_FILE), which the bridge verifies (its ADR-0001 D2); the registry's tools/list carries no caller]
    evidence: [idp-mcp-bridge ADR-0001, idp-mcp ADR-0001 15.1, this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH O: bob's run reaches the third party through HOST, gateway and bridge with his own token and nothing of TELOS; alice, who has not connected, is told to authorize and the third party is not called), platform plan idp-mcp-bridge-oauth-plan.md]
  - id: workspace-bridge-connections
    port: 8681   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-workspace
    to: idp-mcp-bridge
    interface: GET /internal/v1/connections, POST /internal/v1/connections/{id}/authorization and /callback, DELETE /internal/v1/connections/{id}/grant, the reviewer account's routes, GET /internal/v1/connections/{id}/client-metadata (connected services, idp-workspace D30)
    contract: null  # the bridge's own internal API; what the Workspace answers members follows idp.telos.workspace 1.4.0
    auth: [exchange (RFC 8693): the member's token exchanged for the bridge's audience (IDP_BRIDGE_API_AUDIENCE) by the Workspace's client (azp), which the bridge verifies against Keycloak's keys; the member and the tenant come from that token and from nothing else]
    evidence: [idp-workspace ADR-0001 D30 (go test ./tests/integration), idp-mcp-bridge ADR-0001 D16, D21 to D32, this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH O: connect, refresh, a wrong iss, disconnect; a state started by bob and presented with alice's token is refused and the bridge is not called)]
  - id: web-browser-render
    port: 8590   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    from: idp-web
    to: idp-browser
    interface: POST /render {url, timeoutMs, maxBytes} (the page's rendered DOM); the request carries idp-web's ES256 caller assertion, audience the render URL exactly (idp-web D33, idp-browser D8)
    contract: null  # idp-browser's own API
    auth: [the caller assertion signed with idp-web's key (IDP_WEB_RENDER_KEY_FILE), which the renderer verifies against idp-web's public key (IDP_BROWSER_CALLER_KEYS_FILE); only idp-web is admitted by the NetworkPolicy]
    evidence: [idp-browser ADR-0001 D3, D8, idp-web ADR-0001 D33, this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH M6: a page whose text exists only after script is read and cited as rendered; the SSRF page's every forbidden request is refused at the proxy; a storm ends within the budgets; an access-denied page and a PDF are not rendered; with the renderer stopped a script page gives needs_script), platform plan browser-capability-plan.md]
  # KB3 (knowledge-base plan section 5; idp-cmi ADR-0001 D61 to D70): the conversion of the originals of knowledge documents. Three hops, each a flow of the full overlay only
  # (kubernetes: full-only: no component's own manifests carry both ends; tools/k8s_check.py --full checks them): the CMI calls the ingest sandbox through the SYSTEM gateway
  # (a gateway of its own: idp-mcp D6), the gateway calls the sandbox, and the sandbox moves the bytes to and from the CMI's internal file endpoint with a ticket
  - id: cmi-mcp-ingest
    port: 3221   # the system gateway's port in deploy/kubernetes/full/ingest.yaml (compose: 3320 on its own container)
    kubernetes: full-only
    from: idp-cmi
    to: idp-mcp
    interface: MCP (streamable HTTP, 2026-07-28) through the SYSTEM mcp-gateway (the tenant of the platform's own workload; one target `ingest`, one client, the CMI); tools ingest__sandbox_create / _import_file / _run / _export_file / _delete
    contract: null  # the MCP protocol itself
    auth: [OAuth client credentials of the service account idp-cmi-ingest (tenant_id of the system tenant, role cmi-ingest, audience the system gateway, preferred_username = the CMI's workloadSubject); the gateway lists only that client, and `ingest__*` is not host-only]
    evidence: [idp-cmi ADR-0001 D61, D67, D70, idp-mcp ADR-0001 D6, D46 to D48, this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH P2: a PDF, a DOCX, a PPTX and an XLSX original become located text; HOST's delegated token, a member's token and a probe client's cannot list or call ingest__* and on kind cannot reach the system gateway at all)]
  - id: mcp-sandbox-ingest-tools
    port: 8570   # the callee port the NetworkPolicies must open (tools/k8s_check.py)
    kubernetes: full-only
    from: idp-mcp
    to: idp-sandbox
    to_namespace: idp-sandbox-ingest   # the second instance of the sandbox: its own namespaces, quota, owner label and files endpoint (idp-sandbox D25)
    interface: MCP (streamable HTTP) upstream of the system gateway; the sandbox's tools with the office profile (ooxml2md, pdftext FILE.pdf --markdown)
    contract: null  # the MCP protocol itself
    auth: [none on the hop: a private network that only the system gateway (and the registry's discovery) reaches; the gateway authenticates and authorizes the caller and forwards it, signed with the system gateway's own key (identity=forward, idp-mcp ADR-0001 D40, D44)]
    evidence: [idp-sandbox ADR-0001 D18, D25, this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH P2)]
  - id: sandbox-ingest-cmi-files
    port: 8551   # the CMI's internal file endpoint (IDP_CMI_INGEST_LISTEN), a listener of its own and a Service of its own (idp-cmi-ingest), for the ingest sandbox only
    kubernetes: full-only
    from: idp-sandbox
    from_namespace: idp-sandbox-ingest
    to: idp-cmi
    interface: "GET /content (a read ticket: the original of one document) and POST / (a write ticket: the converted text), the sandbox's sandbox_import_file and sandbox_export_file"
    contract: null  # the CMI's internal interface, not a public contract (idp-cmi ADR-0001 D62)
    auth: [a ticket per file move: HS256 with the CMI's ticket key, for one document, one job attempt, one direction, used once (the sandbox does not verify the signature; the CMI does, against its database)]
    evidence: [idp-cmi ADR-0001 D62 (R139 to R151), idp-sandbox ADR-0001 D15, D25, this repository deploy/compose/e2e.sh and tests/kind/full.sh (PATH P2f: a forged ticket is refused; on kind only the ingest sandbox's pods reach the port)]
